    notes: >
      Base, L1 and L2 combined. The declared IRI equals the live pack's GLEIF L1
      ontology, so the fixture URN keeps the two registry records apart. The file
      also declares its own namespace (https://www.gleif.org/ontology/L1#) as a class;
