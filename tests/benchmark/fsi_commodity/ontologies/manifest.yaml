# Pinned ontology snapshots for the FSI / commodity benchmark.
#
# These are Turtle snapshots generated from published sources. The demo pack
# (packages/ontology-engine/demo/config-fsi-commodity.yaml) loads six of them
# through source_file entries under the same ontology_id: gleif-lei, fibo,
# uncefact, isda-cdm, dcsa-ebl, bfo-2020. The fibo-* modules overlap fibo.
#
# Fields
#   key            short name; also the file stem
#   file           snapshot file in this directory
#   ontology_id    id the snapshot is registered under, by this loader and by the
#                  pack. A fixture URN, so it never merges with a live-fetched
#                  ontology (the GLEIF file declares the live GLEIF L1 IRI).
#   declared_iri   the owl:Ontology IRI written inside the file (informational)
#   ontology_type  OntologyType value sent on ingest
#   derived        true when the upstream publishes no OWL/RDF and the snapshot
#                  was converted from another format; its class IRIs were minted
#                  by the converter rather than the standards body
#   license        upstream licence as checked at its source; license_verified
#                  false means it has not been checked yet
#   source         where the upstream content comes from
#   snapshot       version suffix of the generated file (-v1, -v2)
#   sha256, bytes  pin the exact file; the unit test fails if either changes
#   classes        owl:Class / rdfs:Class count at generation time
#   optional       not committed (too large); the loader skips it unless the
#                  file is present and --include-optional is given
#   notes          anything a caller must know before loading

ontologies:
  - key: bfo-2020
    file: bfo-2020.ttl
    ontology_id: "urn:coa:fixture:fsi-commodity:bfo-2020"
    declared_iri: "http://purl.obolibrary.org/obo/bfo.owl"
    title: Basic Formal Ontology 2020
    ontology_type: foundational
    derived: false
    license: CC-BY-4.0
    license_verified: true
    source: "https://github.com/BFO-ontology/BFO-2020"
    snapshot: v1
    sha256: bf783f99e72479fd46cb8c17c204adfd43c9e43beea5f79c79bd61752d416aad
    bytes: 26066
    classes: 36
    domain_tags: [upper-ontology]
    notes: Upper ontology (ISO/IEC 21838-2). Class IRIs are opaque BFO_nnnnnnn codes; labels carry the meaning.

  - key: fibo
