  - key: uncefact
    file: uncefact.ttl
    ontology_id: "urn:coa:fixture:fsi-commodity:uncefact"
    declared_iri: "https://vocabulary.uncefact.org/unece.jsonld"
    title: UN/CEFACT Web Vocabulary (subset)
    ontology_type: foundational
    derived: false
    # The snapshot's source (unece.jsonld in github.com/uncefact/vocabulary-outputs) has no licence
    # file. github.com/uncefact/governance says all UN/CEFACT GitHub content is free to use and repos
    # carry their licence, "usually GPL3". The vocabulary's maintained successor,
    # opensource.unicc.org/un/unece/uncefact/vocab-bsp (serves vocab.unece.org), is GPL-3.0-or-later.
    # The ontology files declare no dcterms:license of their own.
    license: GPL-3.0-or-later
    license_verified: true
    source: "https://github.com/uncefact/vocabulary-outputs"
    snapshot: v1
    sha256: 46504be25a600261f1f23ae17b1cf6661f7dee4ae11d599e4ea55cd46a07089a
    bytes: 832313
    classes: 542
    domain_tags: [trade, logistics, documents, settlement]
    notes: >
      542 of the vocabulary's classes, without the code lists' members. Also
      declares the namespace (https://vocabulary.uncefact.org/unece.jsonld#) as a class.

  - key: dcsa-ebl
