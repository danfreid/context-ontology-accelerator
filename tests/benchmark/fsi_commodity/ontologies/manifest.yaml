    snapshot: v2
    sha256: 4094888d43b10b48a7ef5d46a834719910e53d6b527a2e37cd490f921d441208
    bytes: 164068
    classes: 106
    domain_tags: [shipping, ebl, post-trade, logistics]
    notes: >
      Converted from DCSA's OpenAPI schemas; DCSA publishes no OWL, so the urn:dcsa:ebl:
      IRIs were minted by the converter. Has TransportDocument, HouseBillOfLading,
      Consignee, NotifyParty, CargoItem, Endorsee. No letter of indemnity class.

  - key: isda-cdm
    file: isda-cdm.ttl
