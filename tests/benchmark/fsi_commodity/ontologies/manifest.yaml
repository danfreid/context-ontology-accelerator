    bytes: 686457
    classes: 1244
    domain_tags: [finance, fibo]
    notes: >
      Combined FIBO subset across FND, FBC, BE, DER, SEC, IND, LOAN. Overlaps the
      fibo-* module snapshots below; load either this file or the modules. The
      declared owl:Ontology IRI is the LOAN module's, which is why ontology_id is set here.

