    ontology_type: foundational
    derived: true
    license: Community Specification License 1.0
    license_verified: true
    source: "https://github.com/finos/common-domain-model"
    snapshot: v2
    sha256: 09823e12c6d94a716e36973a32dd6fdba72759a483fc2cb56da9df298db8813f
    bytes: 725837
    classes: 523
    domain_tags: [derivatives, isda, csa, collateral, margin, trade-lifecycle]
    notes: >
      Converted from the CDM Rosetta model; class IRIs are the CDM qualified type names
      under https://cdm.finos.org/model/. Covers Trade, TradeState, ISDA MasterAgreement
