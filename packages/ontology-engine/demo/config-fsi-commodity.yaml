    format: turtle
    license: Apache-2.0
    license_tier: unrestricted
    source_url: https://ref.gs1.org/standards/epcis/epcis-ontology.ttl
    domain_tags: [commodity, metals, tracking, certificate-of-custody, logistics]
    sample_classes:
      - class_uri: "https://ref.gs1.org/epcis/EPCISEvent"
        labels: [EPCIS Event]
        comments: [A traceable event in a commodity's lifecycle — assay, transfer, delivery]
      - class_uri: "https://ref.gs1.org/epcis/ObjectEvent"
        labels: [Object Event]
        comments: [Event on a specific commodity lot — loading, sampling, discharge]
      - class_uri: "https://ref.gs1.org/epcis/TransformationEvent"
        labels: [Transformation Event]
        comments: [A processing event that transforms inputs to outputs — refining, blending]
      - class_uri: "https://ref.gs1.org/epcis/AggregationEvent"
        labels: [Aggregation Event]
