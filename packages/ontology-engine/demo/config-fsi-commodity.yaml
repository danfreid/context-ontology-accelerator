# FSI + Commodity Trading Ontology Pack
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   python setup.py --config config-fsi-commodity.yaml
#   python demo.py  --config config-fsi-commodity.yaml
#
# Two kinds of entry:
#   • source_url — fetched live by the engine. Used for the ontologies in the
#     base COA foundational catalog (Schema.org, Dublin Core, PROV-O, and FIBO
#     Agreements, Contracts, Financial Products and Services, Clients and
#     Accounts), and for FIBO IR Swaps, Bonds, Basket Indices and GS1 EPCIS,
#     which no uploaded snapshot covers.
#   • source_file — an uploaded snapshot (tests/benchmark/fsi_commodity/
#     ontologies/, pinned by sha256), loaded through the upload route under a
#     urn:coa:fixture:fsi-commodity:<key> id: GLEIF LEI, FIBO (combined),
#     UN/CEFACT (latest draft), ISDA CDM, DCSA eBL, BFO 2020, FOLIO.
#     The upload embeds every class. Licences and attribution:
#     tests/benchmark/fsi_commodity/ontologies/NOTICE.md.
#
# Covered:
#   • Legal entity identity, LEI registration, ownership (GLEIF, FIBO BE)
#   • Agreements, contracts, collateral agreements (FIBO FND)
#   • Accounts, credit accounts, loans, debt (FIBO FBC, LOAN)
#   • Derivatives OTC and cleared; interest rate swaps (FIBO DER)
#   • ISDA Master Agreement and clauses, CSA thresholds and IM/VM margin,
#     trade lifecycle, confirmations (ISDA CDM)
#   • Bill of lading, shipper, consignee, notify party, cargo (DCSA eBL)
#   • Consignments, trade agreements and items, trade documents, conformity
#     assessment and attestation, settlement, payment terms (UN/CEFACT)
#   • Letters of credit (incl. standby), letter of indemnity clauses, legal
#     concepts (FOLIO)
#   • Lot tracking / chain of custody (GS1 EPCIS)
#   • Document and email provenance (PROV-O, Dublin Core)
#
# Gaps — model in a customer ontology:
#   • NAESB and EEI contract clauses; ACTUS contract types
#   • Netting sets; UCP 600 / ISP98 rule detail for letters of credit
#   • Commodity price benchmarks (Platts, Argus, Henry Hub)
#
# sample_classes: bound client-side embedding for source_url entries, and list
# the classes the FSI benchmark corpus may ground to (tests/benchmark/fsi_commodity/
# ontology.py). Every sample IRI is declared in its source file.
# ──────────────────────────────────────────────────────────────────────────────

services:
  ontology-catalog:    "http://localhost:8001"
  embedding-generator: "http://localhost:8001"
  data-catalog:        "http://localhost:8003"
  ontology-inducer:    "http://localhost:8001"
  ontology-validation: "http://localhost:8001"

induction_defaults:
  ontology_uri_prefix: "https://example.com/ontology/fsi#"
  label: "FSI Commodity Trading Domain Ontology"
  confidence_threshold: 0.65
  strategy: "table_to_ontology"
  scoring_strategy: "lexical"
  structural_weight: 0.05
  namespace: "fsi-commodity"

# ──────────────────────────────────────────────────────────────────────────────
# FOUNDATIONAL TIER — published, well-maintained, standards-body ontologies
# ──────────────────────────────────────────────────────────────────────────────

foundational_ontologies:

  # ── Schema.org ─────────────────────────────────────────────────────────────
  # Keeps the same curated FSI-relevant subset from config-example.yaml.
  # Invoice, Order, FinancialProduct, MonetaryAmount anchor post-trade docs.
  - uri: "https://schema.org/"
    title: Schema.org
    description: Vocabulary for structured data on the web — anchors invoice, product, organization
    format: turtle
    license: CC-BY-SA-3.0
    license_tier: attribution
    source_url: https://schema.org/version/latest/schemaorg-current-https.ttl
    domain_tags: [general, finance, trade, documents]
    sample_classes:
      - class_uri: "https://schema.org/Organization"
        labels: [Organization]
        comments: [An organization such as a bank, trading firm, exchange, or broker]
      - class_uri: "https://schema.org/Person"
        labels: [Person]
        comments: [A natural person — counterparty contact, authorized trader, KYC subject]
      - class_uri: "https://schema.org/FinancialProduct"
        labels: [Financial Product]
        comments: [A financial instrument — swap, forward, option, futures contract]
      - class_uri: "https://schema.org/Invoice"
        labels: [Invoice]
        comments: [A statement of money due for goods or services — commercial invoice in trade finance]
      - class_uri: "https://schema.org/Order"
        labels: [Order]
        comments: [A trade order or purchase/sale confirmation]
      - class_uri: "https://schema.org/MonetaryAmount"
        labels: [Monetary Amount]
        comments: [A monetary value — notional, settlement amount, margin call, credit limit]
      - class_uri: "https://schema.org/PostalAddress"
        labels: [Postal Address]
        comments: [Physical or registered address of a legal entity or delivery location]
      - class_uri: "https://schema.org/Place"
        labels: [Place]
        comments: [A named location — delivery point, loading port, discharge port]
      - class_uri: "https://schema.org/Event"
        labels: [Event]
        comments: [A trade lifecycle event — execution, confirmation, settlement, expiry]
      - class_uri: "https://schema.org/Action"
        labels: [Action]
        comments: [An action taken — submit order, confirm trade, issue margin call]
      - class_uri: "https://schema.org/CreativeWork"
        labels: [Creative Work]
        comments: [A document — contract, confirmation, bill of lading, certificate]
      - class_uri: "https://schema.org/Service"
        labels: [Service]
        comments: [A financial service — clearing, custody, prime brokerage]
    sample_properties:
      - property_uri: "https://schema.org/name"
        labels: [name]
        comments: [Legal name of an entity or instrument]
        domain: "https://schema.org/Thing"
        range: "xsd:string"
      - property_uri: "https://schema.org/identifier"
        labels: [identifier]
        comments: [External identifier — LEI, BIC, ISIN, CUSIP, trade ID]
        domain: "https://schema.org/Thing"
        range: "xsd:string"
      - property_uri: "https://schema.org/startDate"
        labels: [start date]
        comments: [Trade date, effective date, or value date]
        domain: "https://schema.org/Event"
        range: "xsd:dateTime"
      - property_uri: "https://schema.org/endDate"
        labels: [end date]
        comments: [Maturity date, expiry date, or delivery period end]
        domain: "https://schema.org/Event"
        range: "xsd:dateTime"

  # ── W3C PROV-O ─────────────────────────────────────────────────────────────
  # Document provenance and lineage. Anchors email parsing (who sent what
  # attachment when), audit trail for confirmations, CoQ/CoC chain of custody.
  - uri: "http://www.w3.org/ns/prov#"
    title: PROV-O
    description: W3C Provenance Ontology — document lineage, email attachment chain of custody
    format: turtle
    license: W3C
    license_tier: unrestricted
    source_url: https://www.w3.org/ns/prov-o
    domain_tags: [provenance, documents, email, audit]
    sample_classes:
      - class_uri: "http://www.w3.org/ns/prov#Entity"
        labels: [Entity]
        comments: [A document, file, email, or attachment with fixed content]
      - class_uri: "http://www.w3.org/ns/prov#Activity"
        labels: [Activity]
        comments: [An action that transforms or generates documents — sending email, signing eBL]
      - class_uri: "http://www.w3.org/ns/prov#Agent"
        labels: [Agent]
        comments: [A party responsible for an activity — trader, operations team, system]
      - class_uri: "http://www.w3.org/ns/prov#Collection"
        labels: [Collection]
        comments: [A group of entities — email with attachments, trade package]

  # ── Dublin Core Terms ──────────────────────────────────────────────────────
  # Metadata on documents: title, creator, date, subject. Useful for
  # classifying trade confirmations, invoices, and eBL metadata.
  - uri: "http://purl.org/dc/terms/"
    title: Dublin Core Terms
    description: Metadata vocabulary for document description — confirmation, invoice, certificate headers
    format: rdf-xml
    license: CC-BY-4.0
    license_tier: attribution
    source_url: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/dublin_core_terms.rdf
    domain_tags: [metadata, documents]
    sample_classes:
      - class_uri: "http://purl.org/dc/terms/Agent"
        labels: [Agent]
        comments: [A party — issuer, counterparty, carrier, inspector]
      - class_uri: "http://purl.org/dc/terms/BibliographicResource"
        labels: [Bibliographic Resource]
        comments: [A formal document — ISDA confirmation, bill of lading, certificate]
      - class_uri: "http://purl.org/dc/terms/Location"
        labels: [Location]
        comments: [A named place — delivery point, port, exchange venue]

  # ── GLEIF LEI ─────────────────────────────────────────────────────────────
  # Not in the base COA catalog: loaded from the uploaded snapshot, which combines
  # GLEIF Base, L1 and L2 in one file.
  - uri: "urn:coa:fixture:fsi-commodity:gleif-lei"
    title: GLEIF LEI (Base, L1, L2)
    description: >
      Legal Entity Identifier ontology: entity identity, registration authority, LEI
      registry entries (Level 1) and ownership relationships (Level 2). KYC/AML onboarding.
    format: turtle
    license: "GLEIF terms of use (https://www.gleif.org/en/meta/lei-data-terms-of-use/)"
    license_tier: attribution
    upstream: https://www.gleif.org/ontology/
    # Uploaded snapshot, pinned in tests/benchmark/fsi_commodity/ontologies/manifest.yaml.
    source_file: ../../../tests/benchmark/fsi_commodity/ontologies/gleif-lei.ttl
    sha256: f4d62ff963b167d67e699dc895e5abf5c816459a25b2a5b9e331b98ebc08dc66
    domain_tags: [counterparty, legal-entity, kyc, aml, lei, ownership]
    sample_classes:
      - class_uri: "https://www.gleif.org/ontology/Base/Entity"
        labels: [Entity]
        comments: [An entity identified in a GLEIF registry — bank, trading firm, fund, exchange]
      - class_uri: "https://www.gleif.org/ontology/Base/LegalPerson"
        labels: [Legal Person]
        comments: [A legal person capable of entering contracts — counterparty to a trade]
      - class_uri: "https://www.gleif.org/ontology/Base/RegistrationAuthority"
        labels: [Registration Authority]
        comments: [Business registry where an entity is registered — used in KYC verification]
      - class_uri: "https://www.gleif.org/ontology/Base/EntityStatus"
        labels: [Entity Status]
        comments: [Whether the entity is active or inactive — KYC screening input]
      - class_uri: "https://www.gleif.org/ontology/Base/PhysicalAddress"
        labels: [Physical Address]
        comments: [Legal or headquarters address of the entity]
      - class_uri: "https://www.gleif.org/ontology/Base/Period"
        labels: [Period]
        comments: [A time interval — registration validity period]
      - class_uri: "https://www.gleif.org/ontology/L1/LegalEntity"
        labels: [Legal Entity]
        comments: [A legal entity with an LEI — the counterparty record in KYC onboarding]
      - class_uri: "https://www.gleif.org/ontology/L1/LegalEntityIdentifier"
        labels: [Legal Entity Identifier]
        comments: [The 20-character ISO 17442 LEI code]
      - class_uri: "https://www.gleif.org/ontology/L1/LegalEntityIdentifierRegistryEntry"
        labels: [LEI Registry Entry]
        comments: [Registration record for an LEI — status, managing LOU, renewal date]
      - class_uri: "https://www.gleif.org/ontology/L1/LocalOperatingUnit"
        labels: [Local Operating Unit]
        comments: [The LOU that issues and manages the LEI]
      - class_uri: "https://www.gleif.org/ontology/L1/Branch"
        labels: [Branch]
        comments: [A branch of a legal entity — trading desk location, booking branch]
      - class_uri: "https://www.gleif.org/ontology/L1/Fund"
        labels: [Fund]
        comments: [An investment fund counterparty]
      - class_uri: "https://www.gleif.org/ontology/L2/DirectConsolidation"
        labels: [Direct Consolidation]
        comments: [Direct parent-child ownership relationship between legal entities]
      - class_uri: "https://www.gleif.org/ontology/L2/UltimateConsolidation"
        labels: [Ultimate Consolidation]
        comments: [Ultimate beneficial owner relationship — top of the ownership chain]
    sample_properties:
      - property_uri: "https://www.gleif.org/ontology/Base/hasNameLegal"
        labels: [has legal name]
        comments: [Official registered legal name of the entity]
        domain: "https://www.gleif.org/ontology/Base/Entity"
        range: "xsd:string"
      - property_uri: "https://www.gleif.org/ontology/Base/hasLegalJurisdiction"
        labels: [has legal jurisdiction]
        comments: [Jurisdiction under which the entity is legally formed]
        domain: "https://www.gleif.org/ontology/Base/Entity"
        range: ""
      - property_uri: "https://www.gleif.org/ontology/L1/LEI"
        labels: [LEI]
        comments: [The LEI code value of a legal entity]
        domain: "https://www.gleif.org/ontology/L1/LegalEntity"
        range: "xsd:string"
      - property_uri: "https://www.gleif.org/ontology/L1/hasLegalName"
        labels: [has legal name]
        comments: [Official registered legal name]
        domain: "https://www.gleif.org/ontology/L1/LegalEntity"
        range: "xsd:string"
      - property_uri: "https://www.gleif.org/ontology/L1/hasLegalAddress"
        labels: [has legal address]
        comments: [Registered legal address of the entity]
        domain: "https://www.gleif.org/ontology/L1/LegalEntity"
        range: "https://www.gleif.org/ontology/Base/PhysicalAddress"

  # ── FIBO (uploaded snapshot) ───────────────────────────────────────────────
  # Replaces the live FIBO Parties, Derivatives Basics and BE Legal Persons modules,
  # which are not in the base COA catalog. Interest Rate Swaps, Bonds and Basket
  # Indices are not in the snapshot, so they stay live below.
  - uri: "urn:coa:fixture:fsi-commodity:fibo"
    title: FIBO (combined subset)
    description: >
      FIBO across FND, FBC, BE, DER, SEC, IND and LOAN: parties, legal entities, derivatives,
      debt, loans and securities. Overlaps the four base-catalog FIBO modules above.
    format: turtle
    license: MIT
    license_tier: unrestricted
    upstream: https://spec.edmcouncil.org/fibo/
    # Uploaded snapshot, pinned in tests/benchmark/fsi_commodity/ontologies/manifest.yaml.
    source_file: ../../../tests/benchmark/fsi_commodity/ontologies/fibo.ttl
    sha256: 0d6c0607493c0509fe67546bbc731f09e11d711ee8dfb8f1f528690e672e975b
    domain_tags: [finance, fibo, counterparty, derivatives, credit, securities]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/PartyRoleIdentifier"
        labels: [Party Role Identifier]
        comments: [Identifier for a party in a role — counterparty ID, account number, trader ID]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Parties/Parties/TaxIdentifier"
        labels: [Tax Identifier]
        comments: [Tax ID of a counterparty — collected in KYC onboarding (EIN, VAT number)]
      # DerivativeInstrument and Underlier are FBC-namespace classes restated in this module.
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/DerivativeInstrument"
        labels: [Derivative Instrument]
        comments: [An instrument whose value derives from an underlying — swap, forward, option, futures]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/FinancialInstruments/Underlier"
        labels: [Underlier]
        comments: [The underlying asset — crude oil price, power price, FX rate, interest rate]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativeSettlementTerms"
        labels: [Derivative Settlement Terms]
        comments: [Cash or physical settlement specification for a derivative trade]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/OverTheCounterDerivativeInstrument"
        labels: [OTC Derivative Instrument]
        comments: [A bilateral OTC derivative — commodity swap, power forward, FX forward under ISDA]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/DerivativesClearingOrganization"
        labels: [Derivatives Clearing Organization]
        comments: [A CCP clearing exchange-traded or cleared OTC derivatives — ICE Clear, CME Clearing]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/PayingParty"
        labels: [Paying Party]
        comments: [The party paying a leg of a derivative]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/DerivativesContracts/DerivativesBasics/ReceivingParty"
        labels: [Receiving Party]
        comments: [The party receiving a leg of a derivative]
      # LegalEntity now lives in the OMG Commons namespace; this module restates it.
      - class_uri: "https://www.omg.org/spec/Commons/Organizations/LegalEntity"
        labels: [Legal Entity]
        comments: [An entity with legal standing — corporation, partnership, trust]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/BusinessEntity"
        labels: [Business Entity]
        comments: [A legal entity conducting business — trading company, producer, refiner]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/SpecialPurposeVehicle"
        labels: [Special Purpose Vehicle]
        comments: [An SPV counterparty — common in structured commodity finance; KYC beneficial-ownership flag]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/BE/LegalEntities/LegalPersons/PowerOfAttorney"
        labels: [Power Of Attorney]
        comments: [Authority to act for an entity — authorized signatories collected in onboarding]

  # ── FIBO Foundations — Parties and Agreements ──────────────────────────────
  # Lightweight but authoritative. These FND modules are the base layer most
  # other FIBO modules import. They define Agreement, Contract, Party, Obligor,
  # Obligee, Beneficiary — the backbone of any trading relationship.
  - uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/"
    title: FIBO FND — Agreements
    description: >
      FIBO Foundations Agreements — obligor, obligee, beneficiary, mutual commitment.
      Anchors ISDA Master Agreement, NAESB Base Contract, CSA, credit terms.
    format: turtle
    license: MIT
    license_tier: unrestricted
    source_url: https://spec.edmcouncil.org/fibo/ontology/master/latest/FND/Agreements/Agreements.ttl
    domain_tags: [finance, contracts, isda, naesb]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Agreement"
        labels: [Agreement]
        comments: [A mutual understanding between parties about rights and duties — ISDA Master, NAESB Base Contract]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligor"
        labels: [Obligor]
        comments: [A party bound by an obligation — payment leg, delivery obligation]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Obligee"
        labels: [Obligee]
        comments: [The party to whom an obligation is owed — settlement recipient]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Agreements/Beneficiary"
        labels: [Beneficiary]
        comments: [Party named to receive funds or delivery — LC beneficiary, settlement payee]

  - uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/"
    title: FIBO FND — Contracts
    description: >
      FIBO Foundations Contracts — bilateral contract, assignable contract,
      collateral agreement. The structural basis for ISDA, CSA, and EEI contracts.
    format: turtle
    license: MIT
    license_tier: unrestricted
    source_url: https://spec.edmcouncil.org/fibo/ontology/master/latest/FND/Agreements/Contracts.ttl
    domain_tags: [finance, contracts, isda, csa, derivatives]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Contract"
        labels: [Contract]
        comments: [A voluntary, deliberate agreement — ISDA Master Agreement, EEI Contract]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/BilateralContract"
        labels: [Bilateral Contract]
        comments: [A contract with mutual obligations — most OTC and physical energy contracts]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/CollateralAgreement"
        labels: [Collateral Agreement]
        comments: [Agreement securing performance with assets — ISDA CSA, VM/IM agreement]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/AssignableContract"
        labels: [Assignable Contract]
        comments: [Contract whose rights can transfer — assignment, novation in derivatives]

  # ── FIBO Financial Business and Commerce ───────────────────────────────────
  # FBC covers financial products, accounts, credit facilities, financial
  # service providers, and brokers — the vocabulary for trading relationships,
  # credit lines, and service agreements.
  - uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/"
    title: FIBO FBC — Financial Products and Services
    description: >
      FIBO FBC financial products vocabulary — financial instrument, financial service,
      financial service provider, broker. Maps to trading accounts, clearing, custody.
    format: turtle
    license: MIT
    license_tier: unrestricted
    source_url: https://spec.edmcouncil.org/fibo/ontology/master/latest/FBC/ProductsAndServices/FinancialProductsAndServices.ttl
    domain_tags: [finance, products, clearing, brokerage]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct"
        labels: [Financial Product]
        comments: [A product provided by financial institutions — swap, bond, LC, structured note]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialServiceProvider"
        labels: [Financial Service Provider]
        comments: [An institution providing financial services — bank, broker, CCP, ISDA dealer]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/Broker"
        labels: [Broker]
        comments: [An intermediary executing transactions — energy broker, FX broker, voice broker]

  - uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/"
    title: FIBO FBC — Clients and Accounts
    description: >
      FIBO FBC clients and accounts — trading account, account holder, credit facility.
      Maps to margin accounts, credit lines, netting account sets.
    format: turtle
    license: MIT
    license_tier: unrestricted
    source_url: https://spec.edmcouncil.org/fibo/ontology/master/latest/FBC/ProductsAndServices/ClientsAndAccounts.ttl
    domain_tags: [finance, accounts, credit, netting]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account"
        labels: [Account]
        comments: [A formal relationship — trading account, margin account, credit account]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountHolder"
        labels: [Account Holder]
        comments: [Party holding an account — trading counterparty, clearing member]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/LoanOrCreditAccount"
        labels: [Loan Or Credit Account]
        comments: [A credit account — counterparty credit line, revolving facility, LC facility]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/BrokerageAccount"
        labels: [Brokerage Account]
        comments: [An account held with a broker — futures clearing account, margin account]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/AccountProvider"
        labels: [Account Provider]
        comments: [The institution providing the account — clearing broker, bank]

  - uri: "https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/"
    title: FIBO DER — Interest Rate Swaps
    description: >
      FIBO interest rate swaps — fixed-float, basis swap, overnight index swap.
      Covers ISDA swap confirmations and CSA credit support annex.
    format: turtle
    license: MIT
    license_tier: unrestricted
    source_url: https://spec.edmcouncil.org/fibo/ontology/master/latest/DER/RateDerivatives/IRSwaps.ttl
    domain_tags: [derivatives, isda, rates, swap]
    sample_classes:
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/InterestRateSwap"
        labels: [Interest Rate Swap]
        comments: [An OTC swap exchanging fixed and floating interest payment streams]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FixedInterestRateLeg"
        labels: [Fixed Interest Rate Leg]
        comments: [The fixed payment leg of an interest rate swap]
      - class_uri: "https://spec.edmcouncil.org/fibo/ontology/DER/RateDerivatives/IRSwaps/FloatingInterestRateLeg"
        labels: [Floating Interest Rate Leg]
        comments: [The floating payment leg referencing a benchmark rate — SOFR, EURIBOR]

  # ── FIBO Securities — Debt ─────────────────────────────────────────────────
